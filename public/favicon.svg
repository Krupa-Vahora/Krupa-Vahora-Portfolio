<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Left & Right Bracket Color Gradient -->
    <linearGradient id="bracketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Slash Color Gradient -->
    <linearGradient id="slashGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" />

  <!-- Subtle Outer Border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#borderGradient)" stroke-width="1.8" stroke-opacity="0.75" />

  <!-- Coding Elements </> with glow -->
  <g filter="url(#glow)">
    <!-- Left Chevron: < -->
    <path d="M24 21L14 32L24 43" stroke="url(#bracketGradient)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Slash: / -->
    <path d="M35 17L29 47" stroke="url(#slashGradient)" stroke-width="4.8" stroke-linecap="round" />

    <!-- Right Chevron: > -->
    <path d="M40 21L50 32L40 43" stroke="url(#bracketGradient)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>